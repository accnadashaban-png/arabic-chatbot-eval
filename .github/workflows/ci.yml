name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy chatbot_eval
      - run: pytest --cov=chatbot_eval --cov-report=term-missing

  evaluate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Golden set quality
        run: python -m chatbot_eval validate
      - name: The support bot's FAQ contains no test questions
        run: python -m chatbot_eval validate --training supportbot/demo_kb/faq.csv --strict
      - name: Demo UAT rounds and reports
        run: python -m chatbot_eval demo
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: reports/
