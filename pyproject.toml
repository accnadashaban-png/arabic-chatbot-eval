[project]
name = "arabic-chatbot-eval"
version = "2.1.0"
description = "Evaluate an Arabic + English chatbot before launch, plus a red-teamed customer-support bot any business can run on its own FAQ."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nada Shaban" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chatbot_eval*", "supportbot*"]

[tool.setuptools.package-data]
"supportbot" = ["lexicon.csv", "demo_kb/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
